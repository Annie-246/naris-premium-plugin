name: Validate plugin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate marketplace and plugin
        run: python scripts/validate_plugin_repo.py

      - name: Install compositor dependency
        run: python -m pip install -r plugins/naris-premium/scripts/requirements.txt

      - name: Test deterministic typography compositor
        run: python -m unittest tests/test_compositor.py

