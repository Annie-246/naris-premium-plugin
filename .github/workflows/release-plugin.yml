name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: package-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag and plugin
        run: |
          python scripts/validate_plugin_repo.py --expected-version "${GITHUB_REF_NAME#v}"

      - name: Package plugin
        run: |
          python scripts/package_plugin.py --version "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/naris-premium-plugin-${{ github.ref_name }}.zip

